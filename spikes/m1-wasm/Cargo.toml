[package]
name = "forge-m1-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "THROWAWAY roadmap M1 spike: rusqlite + axum Router inside a browser Worker"

# Detached from the main workspace on purpose: wasm-only, own lockfile, not part of CI.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
forge-sdk = { path = "../../crates/forge-sdk" }
forge-core = { path = "../../crates/forge-core", features = ["rusqlite"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# 0.2.x is built against the sqlite-wasm-rs 0.5 line that rusqlite 0.40 pulls in.
# 0.3.x targets sqlite-wasm-rs 0.6 and has an incompatible OsCallback trait.
sqlite-wasm-vfs = "0.2"
sqlite-wasm-rs = { version = "0.5", default-features = false }
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
