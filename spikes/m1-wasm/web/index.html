<!doctype html>
<meta charset="utf-8">
<title>Forge M1 spike</title>
<style>body{font:14px/1.4 ui-monospace,monospace;margin:1.5rem}pre{background:#f4f4f4;padding:.75rem;overflow:auto}</style>
<h1>Forge M1 spike (rusqlite + axum in a Worker, OPFS)</h1>
<p>Loads the wasm in a dedicated Worker, opens <code>forge.db</code> on the OPFS sahpool VFS, runs migrations,
creates one source through the axum Router, and reports. Reload to test persistence.</p>
<pre id="out">running…</pre>
<script type="module">
const out = document.getElementById('out');
const worker = new Worker('./worker.js', { type: 'module' });
let nextId = 1;
const pending = new Map();
worker.onmessage = (e) => { const p = pending.get(e.data.id); pending.delete(e.data.id); p?.(e.data); };
worker.onerror = (e) => { window.__result = { fatal: String(e.message || e) }; out.textContent = 'WORKER ERROR: ' + (e.message || e); };
const call = (op, args) => new Promise((res) => { const id = nextId++; pending.set(id, res); worker.postMessage({ id, op, args }); });

const report = { steps: [] };
const step = async (name, fn) => {
  try { const r = await fn(); report.steps.push({ name, ok: true, r }); return r; }
  catch (e) { report.steps.push({ name, ok: false, error: String(e) }); throw e; }
};

try {
  const t0 = performance.now();
  const init = await call('init'); if (!init.ok) throw new Error(init.error);
  report.init = init.result;
  report.ms_total_init = performance.now() - t0;

  const health = await call('dispatch', { method: 'GET', path: '/api/health' });
  report.health = health.ok ? health.result : { error: health.error };

  const before = await call('dispatch', { method: 'GET', path: '/api/sources' });
  report.sources_before = before.ok ? JSON.parse(before.result.body).pagination.total : before.error;

  const created = await call('dispatch', { method: 'POST', path: '/api/sources',
    body: JSON.stringify({ title: 'Spike source ' + new Date().toISOString(), description: 'created via axum Router in a Worker' }) });
  report.create = created.ok ? { status: created.result.status, ms: created.result.ms, body: created.result.body.slice(0, 200) } : { error: created.error };

  const after = await call('dispatch', { method: 'GET', path: '/api/sources' });
  report.sources_after = after.ok ? JSON.parse(after.result.body).pagination.total : after.error;

  report.opfs_persisted = (await navigator.storage?.persisted?.()) ?? null;
  report.userAgent = navigator.userAgent;
  report.done = true;
} catch (e) {
  report.fatal = String(e);
}
window.__result = report;
out.textContent = JSON.stringify(report, null, 2);
</script>
