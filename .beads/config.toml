# Beads Configuration (Forge)
# All settings can also be set via env vars (BD_* prefix) or CLI flags.
# Docs: https://gastownhall.github.io/beads/reference/configuration
#
# Storage: an embedded Dolt store in .beads/embeddeddolt/ (gitignored), synced
# with `bd dolt pull` / `bd dolt push` to the Dolt remote below, which lives in
# this GitHub repository's refs/dolt/* refs. Not the shared server: a shell
# that exports BEADS_DOLT_SERVER_* overrides this file, so unset those first.

actor = "aRustyDev"

[sync]
remote = "git+ssh://git@github.com/resu-mx/forge.git"

[dolt]
mode = "embedded"

