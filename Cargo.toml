[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-sdk",
    "crates/forge-ai",
    "crates/forge-api",
    "crates/forge-typst",
    "crates/forge-server",
    "crates/forge-mcp",
    "crates/forge-cli",
    "crates/forge-wasm",
]
# `forge-wasm` is intentionally NOT added to `[workspace.dependencies]` below.
# That passive guard prevents any other crate from accidentally adding
# `forge-wasm = { workspace = true }` — picking it up requires an explicit
# path dependency that stands out in code review. Per the architecture, only
# browser-targeted code (and forge-wasm's own tests) consume this crate.

[workspace.dependencies]
forge-core = { path = "crates/forge-core", default-features = false }  # consumers opt into features (e.g. "rusqlite") explicitly
forge-sdk = { path = "crates/forge-sdk" }
forge-ai = { path = "crates/forge-ai" }
forge-api = { path = "crates/forge-api" }
forge-typst = { path = "crates/forge-typst" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "js"] }  # `js` is a no-op on native; required for v4 on wasm32-unknown-unknown
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
figment = { version = "0.10", features = ["toml", "env"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
strum = { version = "0.27", features = ["derive"] }
# Root collation only via `new_root` (needs `unstable`): matches Bun's `localeCompare`. no_std, wasm32-safe.
icu_collator = { version = "2.3", default-features = false, features = ["compiled_data", "unstable"] }

# Size-optimised build for the browser runtime only (`just wasm-bundle`). Kept off
# the default release profile so the native server is not built for size.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
