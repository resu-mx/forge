[package]
name = "forge-api"
version = "0.1.0"
edition = "2021"
description = "Transport-agnostic Forge HTTP API (axum Router). Hosted natively by forge-server and, later, in the browser by forge-wasm."

# This crate must stay free of tokio and other native-only dependencies so it can
# compile for wasm32-unknown-unknown (roadmap M4). Hosts opt in to what they need.
[features]
default = []
# Run store calls on tokio's blocking pool instead of inline. Enabled by forge-server.
tokio = ["dep:tokio"]
# Compile PDFs in-process with Typst (forge-typst). Enabled by forge-server. The browser build
# leaves it off and compiles in its own lazily loaded module instead.
pdf = ["dep:forge-typst"]

[dependencies]
forge-core = { workspace = true, features = ["rusqlite"] }
forge-sdk = { workspace = true }
forge-ai = { workspace = true }
forge-typst = { workspace = true, optional = true }
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["rt", "macros"] }
