[package]
name = "forge-server"
version = "0.1.0"
edition = "2021"
description = "Native Axum host for the Forge API (forge-api)"

[lib]
name = "forge_server"
path = "src/lib.rs"

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dependencies]
forge-api = { workspace = true, features = ["tokio", "pdf"] }
forge-sdk = { workspace = true }
forge-core = { workspace = true, features = ["rusqlite"] }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true, features = ["catch-panic"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
