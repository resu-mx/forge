name: App build

# Builds the browser-first app (Rust API compiled to WASM + the Svelte UI), proves it fits
# Cloudflare Pages' limits, and uploads the prebuilt output to the direct-upload Pages project
# resumx-webapp (app.resu.mx) with `wrangler pages deploy`. Building here instead of in
# Cloudflare lets the Rust, wasm-bindgen and bun caches persist between runs.
#
# The deploy job runs only while the repository variable PAGES_DEPLOY_ENABLED is `true`; set it to
# `false` to stop deploying (builds and checks still run). The project, hostname and DNS are owned
# by Terraform in resu-mx/infra.
#
# No `paths:` filter, on purpose: a required check that a path filter skips never reports.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Direct-upload Pages project. Must match the project declared in resu-mx/infra.
  PAGES_PROJECT: resumx-webapp

jobs:
  build:
    name: build static app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache shared by PR and main builds of this job.
          shared-key: app-build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: extractions/setup-just@v2

      # SQLite is compiled from C for wasm32, so the C compiler needs the WebAssembly backend.
      # The justfile assumes the runner's clang has one; assert it instead of assuming.
      - name: Assert the runner clang has a wasm32 backend
        run: clang -print-targets | grep -q wasm32 || { echo "clang has no wasm32 backend"; exit 1; }

      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wbg
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
          [ -n "$v" ] || { echo "could not read wasm-bindgen version from Cargo.lock"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $v"
      - uses: actions/cache@v4
        id: wbg-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wbg.outputs.version }}
      - name: Install wasm-bindgen-cli (prebuilt binary, source build as fallback)
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          v="${{ steps.wbg.outputs.version }}"
          tarball="wasm-bindgen-$v-x86_64-unknown-linux-musl"
          if curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/$tarball.tar.gz" | tar -xz -C /tmp; then
            install -m 0755 "/tmp/$tarball/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
          else
            echo "prebuilt binary unavailable; building from source (slow)"
            cargo install wasm-bindgen-cli --version "$v" --locked
          fi
      - run: wasm-bindgen --version

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build the wasm bundles
        run: just wasm-bundle typst-bundle
      - name: Build the web UI (browser runtime mode)
        run: bun run --filter '@forge/webui' build
        env:
          VITE_FORGE_MODE: wasm

      - name: Check limits and shape
        run: bash scripts/check-app-build.sh packages/webui/build

      - uses: actions/upload-artifact@v4
        with:
          name: app-static
          path: packages/webui/build
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    # Kill switch: PAGES_DEPLOY_ENABLED=false stops deploys. Fork PRs get no secrets, so they stop after `build`.
    if: >-
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: cf-pages-app
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: app-static
          path: build

      # Same 1Password pattern as extension-publish.yml. The Environment must export
      # CLOUDFLARE_API_TOKEN (account-scoped Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
      - name: Load Cloudflare credentials from 1Password
        uses: aRustyDev/load-secrets-action@52cfbba5e153fe5e335e94c31ec0e176a7f2d7fd
        with:
          environment-id: ${{ secrets.OP_ENVIRONMENT_ID_CF_PAGES }}
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - name: Check credentials were loaded (lengths only)
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN not set"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "CLOUDFLARE_ACCOUNT_ID not set"; exit 1; }
          echo "token length ${#CLOUDFLARE_API_TOKEN}, account id length ${#CLOUDFLARE_ACCOUNT_ID}"

      # Production is the `main` branch of the Pages project; PRs get a stable preview alias.
      - name: Deploy
        run: >
          bun --bun x wrangler@4 pages deploy build
          --project-name "$PAGES_PROJECT"
          --branch "${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}"
          --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}"
          --commit-dirty=true
