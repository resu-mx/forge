name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# No `paths:` filter on purpose: a required check whose workflow is skipped by a
# path filter never reports, which blocks the PR (and reads as green elsewhere).

jobs:
  test:
    name: check + test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked

  wasm:
    name: forge-wasm (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Build forge-wasm
        run: just wasm-build
      - name: Build forge-typst (the lazily loaded PDF compiler)
        run: just wasm-cargo build -p forge-typst
      - name: No native-only crates in the wasm dependency tree
        run: just wasm-deps-check
      - name: Control — the probe must be able to fail
        run: just wasm-deps-check-control

  # The contract check: the TypeScript API's own route tests, run against the Rust
  # server over real HTTP (roadmap M3). `just parity-tier0` lists the files the Rust
  # server is expected to pass today; widen that list as more of the API is ported.
  parity:
    name: TS route tests vs Rust server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: extractions/setup-just@v2
      - run: bun install --frozen-lockfile
      - run: just parity-tier0

  # The browser runtime's JavaScript half (@forge/runtime) and the SDK's `fetch` option.
  # No browser needed: the client takes its Worker and Web Locks as dependencies.
  runtime-js:
    name: runtime + SDK tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: packages/runtime
      - run: bun test
        working-directory: packages/runtime
      - run: bun test
        working-directory: packages/sdk

  # The browser-first acceptance spec (roadmap M7): the real UI in Chromium, with the Rust API and
  # the Typst compiler running inside the page and no server. It drives profile → organization →
  # source → bullet → approve → perspective → approve → resume → PDF.
  e2e-wasm:
    name: core loop in the browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: extractions/setup-just@v2
      # Must match the wasm-bindgen version in Cargo.lock.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: bun install --frozen-lockfile
      - name: Build the wasm bundles
        run: just wasm-bundle typst-bundle
      - name: Install Chromium
        run: bun --bun x playwright install --with-deps chromium
        working-directory: packages/webui
      - name: Run the spec against the production build
        run: bun run test:e2e:wasm
        working-directory: packages/webui
        env:
          FORGE_E2E_PREVIEW: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/webui/playwright-report
            packages/webui/test-results
          retention-days: 7

  # Advisory until the codebase is formatted and the todo!() stubs are gone:
  # the repo has never been through rustfmt (~10k diff lines) and clippy reports
  # ~200 warnings, mostly unused variables in stub services. Promote to blocking
  # (drop continue-on-error) once those are cleared.
  lint:
    name: fmt + clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets
        continue-on-error: true
